apiVersion: config.lighthouse.jenkins-x.io/v1alpha1
kind: TriggerConfig
spec:
  presubmits:
    - name: jx3-quality-focal-3-9
      context: jx3-quality-focal-3-9
      always_run: true
      optional: false
      source: quality-focal-3-9.yaml
    - name: jx3-quality-focal-3-10
      context: jx3-quality-focal-3-10
      always_run: true
      optional: false
      source: quality-focal-3-10.yaml
    - name: jx3-quality-focal-3-11
      context: jx3-quality-focal-3-11
      always_run: true
      optional: false
      source: quality-focal-3-11.yaml
    - name: jx3-release-python-package
      context: jx3-release-python-package
      always_run: true
      optional: false
      source: release-python-package.yaml
    - name: jx3-check-next-version
      context: jx3-check-next-version
      always_run: false
      optional: false
      source: check-next-version.yaml
    - name: jx3-init-build-push
      context: jx3-init-build-push
      always_run: true
      source: init-build-push.yaml
  postsubmits:
    - name: jx3-init-build-push
      context: jx3-init-build-push
      source: init-build-push.yaml
      branches:
        - ^main$
    - name: jx3-release-python-package
      context: jx3-release-python-package
      source: release-python-package.yaml
      branches:
        - ^main$
